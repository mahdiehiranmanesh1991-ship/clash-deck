name: Dispatch card refresh

# One-shot helper: the cloud-agent token cannot call workflow_dispatch
# (actions:write). GITHUB_TOKEN can, and that event still starts a run.
on:
  push:
    paths:
      - .github/workflows/dispatch-card-refresh.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: workflow_dispatch Update card data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/actions/workflows/update-data.yml/dispatches" \
            -f ref=main
